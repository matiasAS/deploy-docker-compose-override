name: "Deploy Docker Compose Override"
description: "Generates docker-compose.override.yml with commit hash and copies it to a remote server"
author: "Matias Alvarez"
branding:
  icon: "package"
  color: "blue"

inputs:
  git_hash_commit:
    description: "Commit hash to replace in docker-compose.override.yml"
    required: true
  docker_compose_template:
    description: "Local path to the docker-compose.override.yml template"
    required: true
  ip_server:
    description: "Remote server IP or hostname"
    required: true
  user_ssh:
    description: "SSH user to connect to the remote server"
    required: true
  ssh_private_key:
    description: "Private SSH key to authenticate with the remote server"
    required: true
  docker_compose_override_path:
    description: "Remote directory where docker-compose.override.yml will be placed"
    required: true
  ssh_port:
    description: "SSH port of the remote server"
    required: false
    default: 22

runs:
  using: "composite"
  steps:
    - name: Install gettext for envsubst
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext
      shell: bash

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate docker-compose.override.yml with commit hash
      run: |
        export GIT_HASH_COMMIT="${{ inputs.git_hash_commit }}"
        envsubst '${GIT_HASH_COMMIT}' < "${{ inputs.docker_compose_template }}" > docker-compose.override.yml
      shell: bash

    - name: Create remote secrets directory
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ inputs.ip_server }}
        username: ${{ inputs.user_ssh }}
        key: ${{ inputs.ssh_private_key }}
        script: |
          mkdir -p "${{ inputs.docker_compose_override_path }}"
          chmod 700 "${{ inputs.docker_compose_override_path }}"
        port: ${{ inputs.ssh_port }}

    - name: Copy docker-compose.override.yml to remote server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ inputs.ip_server }}
        username: ${{ inputs.user_ssh }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        source: "docker-compose.override.yml"
        target: "${{ inputs.docker_compose_override_path }}"
        strip_components: 0